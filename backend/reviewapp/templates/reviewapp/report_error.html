<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/svg+xml" sizes="any" href="/static/reviewapp/favicon.svg?v=2">
    <title>Отчёт не сформирован</title>
    <style>
        * { box-sizing: border-box }
        body {
            min-height: 100vh; margin: 0; display: grid; place-items: center;
            padding: 24px; background: #f6f6f7; color: #18181b;
            font: 16px/1.5 Arial, sans-serif
        }
        main {
            width: min(600px, 100%); padding: 36px; background: #fff;
            border: 1px solid #e4e4e7; border-radius: 20px;
            box-shadow: 0 20px 60px #18181b12
        }
        .brand { color: #f20d3a; font-weight: 900 }
        h1 { margin: 8px 0 12px; font-size: 26px }
        p { color: #71717a }
        code { overflow-wrap: anywhere }
        a {
            display: inline-block; margin-top: 12px; padding: 10px 16px;
            border-radius: 10px; background: #18181b; color: #fff;
            font-weight: 700; text-decoration: none
        }
    </style>
</head>
<body>
<main>
    <div class="brand">AI · МТС</div>
    <h1>Отчёт не сформирован</h1>
    <p>{{ message }}</p>
    <p>Файл: <strong>{{ document_name }}</strong><br>ID: <code>{{ report_uuid }}</code></p>
    <a href="{% url 'reviewapp:upload' %}">Запустить новую проверку</a>
</main>
</body>
</html>
